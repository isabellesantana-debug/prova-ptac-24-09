<!DOCTYPE html>
<html lang="PT-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banco de ideias</title>
    
</head>
<body>
    <script src="components.js"></script>

    <h1>Banco de ideias</h1>

    <dialog id="myDialog">
        <form method="dialog">
            <label for="ideaInput">Digite sua ideia:</label>
            <input type="text" id="ideaInput" name="ideaInput" required>
            <menu>
                <button id="cancelButton">Cancelar</button>
                <button id="submitButton">Enviar</button>
            </menu>
        </form>
    </dialog>
 <div class="container">
    <button id="openDialogButton">Adicionar ideia</button>
    <ul id="ideaList"></ul>
</div>
<div class="container">
    <h2>Ideias salvas:</h2>
    <ul id="savedIdeasList"></ul>
</div>
<button id="clearIdeasButton">Limpar ideias salvas</button>

</body>
</html>
