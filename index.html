<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banco de ideias</title>
    
</head>
<body>
    <script src="components.js"></script>

    <h1>Banco de ideias</h1>

    <dialog id="myDialog">
        <form method="dialog">
            <label for="ideaInput">Digite sua ideia:</label>
            <input type="text" id="ideaInput" name="ideaInput" required>
            <menu>
                <button id="cancelButton">Cancelar</button>
                <button id="submitButton">Enviar</button>
            </menu>
        </form>
    </dialog>
    <div id="ideasContainer"></div>
    
</body>
</html>
